# Builds the service, the UI and the installer with build.ps1 for every push and pull request. The
# installer is kept as an artifact of the run.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The project uses the Visual Studio 2019 toolset (v142), which Visual Studio 2022 on the
      # runner does not necessarily include, so the current toolset builds the service here.
      # Building with WiX Toolset v7 requires accepting its Open Source Maintenance Fee EULA; the fee
      # only applies to revenue-generating use by those with an annual gross revenue of US$10,000 or
      # more.
      - name: Build
        run: .\build.ps1 -PlatformToolset v143 -AcceptWixEula

      - uses: actions/upload-artifact@v4
        with:
          name: PrintheadMaintainer
          if-no-files-found: error
          path: artifacts/
